# Sahip: Yusuf. yazan: [Claude#taa-paket-T3 2026-11-05]
# taa-guncelle: yayin.json kontrolü ve güncelleme uygulama (T3). Yeni bağımlılık yok (HTTP yok; ağ kaynağı T4).
[package]
name = "taa-guncelle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA güncelleme: yayin.json kontrolü, indirip doğrulama (SHA256 + ed25519), kur --sec ve geri dönme"

[lib]
name = "taa_guncelle"
path = "src/lib.rs"

[[bin]]
name = "taa-guncelle"
path = "src/main.rs"

[dependencies]
taa-kur = { path = "../taa-kur" }
taa-imza = { path = "../taa-imza" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
taa-dosya = { path = "../taa-dosya" }
# taa-kur ile AYNI sürüm ve özellikler (yalnız testlerde zip paketi üretmek için).
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
