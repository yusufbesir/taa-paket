# taa-cati: TAA Çatı — yalnız sunucu PC'sinde çalışan yönetim programı (kullanıcı/rol, cihaz onayı, program yetkisi, günlük).
# Sahip: Yusuf. yazan: [Claude#taa-cati-S3b 2026-11-06]. Yeni dış crate yok: HTTP taa-kuyruk (curl), oturum taa-kimlik.
[package]
name = "taa-cati"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA Çatı: merkez sunucunun yönetim uçlarını kullanan yönetici aracı (kullanıcı, rol, cihaz onayı, program yetkisi, günlük)"

[lib]
name = "taa_cati"
path = "src/lib.rs"

[[bin]]
name = "taa-cati"
path = "src/main.rs"

# Grafik panel (yerel 127.0.0.1 sunucu + Edge uygulama penceresi). yazan: [Claude#taa-cati-panel 2026-11-17]
[[bin]]
name = "taa-cati-panel"
path = "src/panel_main.rs"

[dependencies]
taa-hata = { path = "../taa-hata" }
serde_json = "1"
taa-kimlik = { path = "../taa-kimlik" }
taa-kuyruk = { path = "../taa-kuyruk" }
taa-yol = { path = "../taa-yol" }
# Panel: çalışma alanında zaten kullanılan crate'ler (taa-fis-sunucu); yeni dış bağımlılık değil.
getrandom = "0.3"
tiny_http = "0.12"
# Görünüm: kontrast hesabı TAA Kurucu'nun tema crate'inden (yerel crate, dış bağımlılık yok). yazan: [Claude#taa-cati-gorunum 2026-11-17]
taa-kur-tema = { path = "../taa-kur-tema" }
