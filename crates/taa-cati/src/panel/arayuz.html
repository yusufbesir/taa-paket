<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAA Çatı</title>
<link rel="icon" href="/simge.svg" type="image/svg+xml">
<!-- Sahip: Yusuf. yazan: [Claude#taa-cati-panel 2026-11-17]. Tasarım: ekip turu v2 (Fable 5.2, GPT-6 Astra, Gemini 3.1 Pro).
     3 tema, düzen de değişir: Kule Gecesi = sol menü (varsayılan), Defter = üst sekmeler, Taş = etiketli sol ray.
     Dış kaynak yok (CSP default-src 'none'); yazı tipleri Windows'ta hazır olanlardır. -->
<style>
:root{
  --bg:#0E1420;--panel:#151D2C;--panel2:#1B2538;--line:#26324A;--line-strong:#5A6B8C;--fg:#E8ECF4;--muted:#8B97AE;
  --accent:#F2A93B;--on-accent:#0E1420;--sel:#E8ECF4;--ok:#4CC38A;--warn:#F2A93B;--err:#FF6B5E;
  --r:8px;--rb:6px;--f-head:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--w-head:600;
  --f-body:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--f-mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --f-title:var(--f-head);--t-title:28px;--dur:120ms;--ease:cubic-bezier(.4,0,.2,1);--enter:translateY(8px);
  color-scheme:dark;
}
:root[data-tema="defter"]{
  --bg:#FAF7F1;--panel:#FFFFFF;--panel2:#F3EEE4;--line:#E4DCCD;--line-strong:#8A7F6B;--fg:#1C2A44;--muted:#6E6A62;
  --accent:#2B4C9B;--on-accent:#FFFFFF;--sel:#2B4C9B;--ok:#2F7D4F;--warn:#B45309;--err:#B42318;
  --r:3px;--rb:3px;--f-head:"Segoe UI",system-ui,sans-serif;--f-body:"Segoe UI",system-ui,sans-serif;--f-mono:Consolas,ui-monospace,monospace;
  --f-title:Georgia,Cambria,"Times New Roman",serif;--t-title:34px;--dur:160ms;--ease:cubic-bezier(.3,.6,.2,1);--enter:translateX(10px);color-scheme:light;
}
:root[data-tema="kule"][data-kip="acik"]{
  --bg:#F1F4F9;--panel:#FFFFFF;--panel2:#E7ECF4;--line:#D5DCE8;--line-strong:#6B7A96;--fg:#0E1420;--muted:#56627A;
  --accent:#B87408;--on-accent:#0E1420;--sel:#1B2538;--ok:#1F7A52;--warn:#B23A12;--err:#B3173F;color-scheme:light;
}
:root[data-tema="tas"]{
  --bg:#D8D9D2;--panel:#ECEDE7;--panel2:#E1E3DB;--line:#B0B3A8;--line-strong:#72776A;--fg:#23261F;--muted:#4F544A;
  --accent:#4A5C24;--on-accent:#F4F6EE;--sel:#4A5C24;--ok:#1F7A6B;--warn:#A2621A;--err:#A33A2C;
  --r:14px;--rb:10px;--f-head:Bahnschrift,"Segoe UI",system-ui,sans-serif;--w-head:600;--f-body:"Segoe UI",system-ui,sans-serif;--f-mono:Consolas,ui-monospace,monospace;
  --f-title:var(--f-head);--t-title:30px;--dur:200ms;--ease:cubic-bezier(.2,.9,.3,1.03);--enter:scale(.985);color-scheme:light;
}
:root[data-tema="defter"][data-kip="koyu"]{
  --bg:#121A30;--panel:#18223D;--panel2:#1F2B4A;--line:#2C3A5E;--line-strong:#6F7FA8;--fg:#F3EEE4;--muted:#A9A391;
  --accent:#8FAAF0;--on-accent:#101830;--sel:#8FAAF0;--ok:#5CC08A;--warn:#E0A040;--err:#F07A6A;color-scheme:dark;
}
:root[data-tema="tas"][data-kip="koyu"]{
  --bg:#1E201C;--panel:#272A24;--panel2:#2F332B;--line:#40453A;--line-strong:#7E8573;--fg:#E6E8DF;--muted:#A8AD9C;
  --accent:#A9BF6A;--on-accent:#1A1E10;--sel:#A9BF6A;--ok:#4FC0AC;--warn:#DDA04E;--err:#E57A68;color-scheme:dark;
}
/* Tanıtım geçişi temaya göre (ekip turu 3): Kule yukarı süzülür, Defter sayfa çevirir, Taş yumuşak geçer. */
:root{--t-dur:120ms;--t-ease:ease-out;--t-gir:translateY(8px);--t-cik:translateY(-8px)}
:root[data-tema="defter"]{--t-dur:160ms;--t-ease:cubic-bezier(.2,.7,.2,1);--t-gir:translateX(24px);--t-cik:translateX(-24px)}
:root[data-tema="tas"]{--t-dur:200ms;--t-ease:ease-in-out;--t-gir:scale(.98);--t-cik:scale(.98)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);transition:background var(--dur),color var(--dur)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main:focus,main:focus-visible{outline:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

#yukle{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:60;transition:opacity .4s}
#yukle.bitti{opacity:0;pointer-events:none}
#yukle .kutu{display:grid;justify-items:center;gap:14px}
#yukle svg path{stroke-dasharray:90;stroke-dashoffset:90;animation:ciz .9s var(--ease) forwards}
#yukle svg path:nth-child(2){animation-delay:.15s}#yukle svg path:nth-child(3){animation-delay:.3s}
#yukle .ad{font:600 22px var(--f-head)}
#yukle .adim{font:12px var(--f-mono);color:var(--muted);min-height:18px}
@keyframes ciz{to{stroke-dashoffset:0}}

.giris{min-height:100%;display:grid;place-items:center;padding:24px}
.giris form{width:min(380px,100%);display:grid;gap:14px}
.giris .marka{justify-content:center;padding-bottom:6px}
label.alan{display:grid;gap:6px;font-size:13px;font-weight:500}
.girdi,select.girdi{width:100%;padding:10px 12px;border-radius:var(--rb);border:1px solid var(--line-strong);background:var(--panel);color:var(--fg)}
.hata-kutu{color:var(--err);font-size:13px;min-height:20px}

.uygulama{display:flex;min-height:100%}
nav.menu{background:var(--panel);border-right:1px solid var(--line);width:240px;flex:none;padding:22px 16px;display:flex;flex-direction:column;gap:4px}
.marka{display:flex;gap:10px;align-items:center;padding-bottom:18px}
.marka svg{flex:none}
.marka b{font:var(--w-head) 16px var(--f-head);display:block}
.marka small{color:var(--muted);font-size:11px}
.oge{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--rb);border:0;background:none;color:var(--muted);text-align:left;width:100%}
.oge:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.oge[aria-current="page"]{background:color-mix(in srgb,var(--sel) 13%,transparent);color:var(--fg);font-weight:500}
.oge .ik{font-family:var(--f-mono);width:16px;text-align:center}
.oge[aria-current="page"] .ik{color:var(--sel)}
.oge .ad{flex:1}
.menu-alt{margin-top:auto;padding-top:14px;font-size:12px;color:var(--muted)}
.rozet{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;padding:0 7px;font-weight:600}
main{flex:1;min-width:0;padding:32px;display:flex;flex-direction:column;gap:20px}
.ust{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ust h1{font:var(--w-head) var(--t-title)/1.15 var(--f-title);margin:0;text-wrap:balance}
.ust .baslik{flex:1;min-width:220px}
.durum{display:inline-flex;gap:10px;align-items:center;padding:7px 12px;border-radius:999px;background:color-mix(in srgb,var(--ok) 13%,transparent);font-size:13px}
.nokta{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.durum.uyari{background:color-mix(in srgb,var(--err) 15%,transparent)}.durum.uyari .nokta{background:var(--err)}

.ekran{display:flex;flex-direction:column;gap:20px;animation:gir var(--dur) var(--ease)}
@keyframes gir{from{opacity:0;transform:var(--enter)}}
.uyari-serit{border:1px solid color-mix(in srgb,var(--err) 45%,var(--line));background:color-mix(in srgb,var(--err) 9%,var(--panel));border-radius:var(--r);padding:14px 18px;margin-bottom:16px}
.uyari-serit h2{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:15px}.uyari-serit h2 .nokta{width:9px;height:9px;border-radius:50%;background:var(--err)}
.uyari-serit p{margin:0 0 8px;font-size:13px}
.kart{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.izgara4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.istat .etiket{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.04em}
.istat .deger{font:var(--w-head) 22px var(--f-head);margin:6px 0 2px;overflow-wrap:anywhere}
.istat .ayr{font:12px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.iki{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:14px;align-items:start}
.kart h2{font:var(--w-head) 17px var(--f-head);margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kart h2 .bos{flex:1}
.etk{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.etk::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.etk.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.etk.uy{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.etk.hata{color:var(--err);background:color-mix(in srgb,var(--err) 14%,transparent)}
.satir{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.satir:last-child{border-bottom:0}
.satir .ana{flex:1;min-width:160px}
.satir .ana b{font-weight:500;display:block;overflow-wrap:anywhere}
.satir .ana span{color:var(--muted);font-size:12px}
.dugme{border-radius:var(--rb);padding:8px 16px;border:1px solid var(--line-strong);background:none;font-weight:500;font-size:13px;white-space:nowrap;transition:transform var(--dur) var(--ease),background var(--dur)}
.dugme:active{transform:scale(.97)}
.dugme.birincil{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dugme.tehlike{color:var(--err)}
.dugme.tehlike.dolu{background:var(--err);color:#fff;border-color:var(--err)}
.olay{display:flex;gap:12px;padding:6px 0}
.olay b{font-weight:500;display:block}.olay span{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.arac{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.parca{display:inline-flex;gap:4px;padding:4px;background:var(--panel2);border-radius:calc(var(--rb) + 4px);flex-wrap:wrap}
.parca button{border:0;background:none;padding:7px 14px;border-radius:var(--rb);color:var(--muted)}
.parca button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line);font-weight:500}
.ara{flex:1;min-width:200px;max-width:320px;margin-left:auto;padding:9px 14px;border-radius:var(--rb);border:1px solid var(--line-strong);background:var(--panel);color:var(--fg)}
.ipucu{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.ipucu .nokta{background:var(--warn);width:6px;height:6px}
.onayla-kutu{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--err)}
.tablo-kap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500;text-transform:uppercase}
.anahtar{width:40px;height:22px;border-radius:999px;border:0;background:var(--line-strong);position:relative;transition:background var(--dur);flex:none}
.anahtar::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform var(--dur) var(--ease)}
.anahtar[aria-checked="true"]{background:var(--accent)}
.anahtar[aria-checked="true"]::after{transform:translateX(18px)}
.anahtar.miras{opacity:.55}
.temalar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tema-sec{border:2px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;background:none;text-align:left}
.tema-sec[aria-pressed="true"]{border-color:var(--accent)}
.tema-sec .on{height:90px;display:flex;gap:6px;padding:10px}
.tema-sec .on i{display:block;border-radius:4px}
.tema-sec .alt{padding:10px 12px;background:var(--panel)}
.tema-sec .alt b{display:block;font-weight:600}
.tema-sec .alt span{font-size:12px;color:var(--muted)}
.ayar-satir{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ayar-satir:last-child{border-bottom:0}
.ayar-satir .ana{flex:1;min-width:200px}
input[type=color]{width:44px;height:32px;border:1px solid var(--line-strong);border-radius:var(--rb);background:none;padding:2px}
.bildirim{position:fixed;right:20px;bottom:20px;max-width:min(460px,calc(100% - 40px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--rb);font-weight:500;opacity:0;transform:translateY(8px);transition:all var(--dur) var(--ease);pointer-events:none;z-index:70}
.bildirim.goster{opacity:1;transform:none}
.bildirim.hata{background:var(--err);color:#fff}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--fg);padding:22px;width:min(420px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:grid;gap:14px}
dialog h2{margin:0;font:var(--w-head) 18px var(--f-head)}
dialog .dugmeler{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.bos-durum{padding:28px 8px;text-align:center;color:var(--muted)}

:root[data-tema="defter"] .uygulama{flex-direction:column}
:root[data-tema="defter"] nav.menu{width:auto;flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:22px;padding:20px 40px 0;border-right:0;border-bottom:1px solid var(--line);background:var(--bg)}
:root[data-tema="defter"] .marka{padding:0 18px 12px 0;width:100%}
:root[data-tema="defter"] nav .marka svg{display:none}
:root[data-tema="defter"] .marka b{font:600 22px var(--f-title);display:inline}
:root[data-tema="defter"] .marka small{font:400 15px var(--f-title);margin-left:8px}
:root[data-tema="defter"] .oge{width:auto;padding:6px 0 10px;border-radius:0;border-bottom:2px solid transparent;background:none!important}
:root[data-tema="defter"] .oge[aria-current="page"]{border-bottom-color:var(--fg)}
:root[data-tema="defter"] .oge .ik{display:none}
:root[data-tema="defter"] .rozet{background:none;color:var(--err);padding:0;font-family:var(--f-mono)}
:root[data-tema="defter"] .rozet::before{content:"("}:root[data-tema="defter"] .rozet::after{content:")"}
:root[data-tema="defter"] main{padding:28px 40px 40px}
:root[data-tema="defter"] .oge[data-git="ayarlar"]{margin-left:auto}
:root[data-tema="defter"] .menu-alt{display:none}

:root[data-tema="tas"] .uygulama{padding:16px;gap:16px}
:root[data-tema="tas"] nav.menu{width:92px;border:0;border-radius:28px;padding:18px 10px;align-items:center;gap:6px}
:root[data-tema="tas"] nav .marka{flex-direction:column;padding-bottom:10px}
:root[data-tema="tas"] nav .marka div{display:none}
:root[data-tema="tas"] .oge{flex-direction:column;gap:4px;padding:8px 4px;border-radius:16px;text-align:center;font-size:11px;line-height:1.25}
:root[data-tema="tas"] .oge .ik{font-size:16px;width:auto}
:root[data-tema="tas"] .rozet{background:var(--err);color:#fff;font-size:10px}
:root[data-tema="tas"] main{padding:20px}
:root[data-tema="tas"] .dugme{padding:11px 20px;min-height:44px}
:root[data-tema="tas"] .dugme:active{transform:none}
:root[data-tema="tas"] .menu-alt{display:none}

@media (max-width:820px){
  .uygulama{flex-direction:column}
  nav.menu,:root[data-tema="tas"] nav.menu{width:auto;flex-direction:row;overflow-x:auto;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px}
  :root[data-tema="tas"] .uygulama{padding:12px;gap:12px}
  nav .marka{padding:0 8px 0 0}nav .marka div{display:none}
  .oge{width:auto;white-space:nowrap;flex:none}
  :root[data-tema="tas"] .oge{flex-direction:row;font-size:13px}
  main,:root[data-tema="defter"] main{padding:20px 16px}
  .iki{grid-template-columns:1fr}
  .menu-alt{display:none}
}
.segment{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--rb);overflow:hidden;flex-wrap:wrap}
.segment button{border:0;background:none;padding:7px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.segment button+button{border-left:1px solid var(--line)}
.segment button[aria-pressed="true"]{background:var(--sel);color:var(--panel)}
.not{font-size:12px;margin-top:6px;color:var(--muted)}
.not.uyari{color:var(--warn)}
.renk-sec{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.renk-sec input[type=color]{width:44px;height:32px;padding:0;border:1px solid var(--line-strong);border-radius:var(--rb);background:none}
#tanitim{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:var(--bg);padding:24px}
#tanitim[hidden]{display:none}
#tanitim .cerceve{width:min(460px,100%);display:grid;gap:22px;justify-items:center;text-align:center}
#tanitim .sahne{display:grid;gap:14px;justify-items:center;min-height:230px;align-content:center}
#tanitim .sahne.gir{animation:t-gir var(--t-dur) var(--t-ease) both}
#tanitim .sahne.cik{animation:t-cik var(--t-dur) var(--t-ease) both}
@keyframes t-gir{from{opacity:0;transform:var(--t-gir)}to{opacity:1;transform:none}}
@keyframes t-cik{from{opacity:1;transform:none}to{opacity:0;transform:var(--t-cik)}}
#tanitim .simge{width:96px;height:96px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
#tanitim h2{font:var(--w-head) 24px/1.2 var(--f-title);margin:0;text-wrap:balance}
#tanitim p{margin:0;color:var(--muted);font-size:15px;max-width:36ch}
#tanitim .noktalar{display:flex;gap:8px}
#tanitim .noktalar i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
#tanitim .noktalar i.aktif{background:var(--accent)}
#tanitim .dugmeler{display:flex;gap:10px;justify-content:center}
.pin-durum{font-size:12px}
.onay-sec{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.onay-sec .girdi{width:auto;min-width:120px;padding:6px 8px;font-size:13px}
.sayi-gir{font-size:28px;letter-spacing:.3em;text-align:center;width:6ch;margin:0 auto;display:block}
.pin-durum.var{color:var(--ok)}.pin-durum.yok{color:var(--muted)}
@media (prefers-reduced-motion:reduce){:root:not(.hareket-normal) *,:root:not(.hareket-normal) *::before,:root:not(.hareket-normal) *::after{animation:none!important;transition:none!important}}
:root.az-hareket *,:root.az-hareket *::before,:root.az-hareket *::after{animation:none!important;transition:none!important}
/* yazdır başlığı yalnız çıktıda */.yazdir-baslik{display:none}
@media print{.menu,.arac,#bildirim,.ust .durum,details>summary{display:none!important}details{display:block}details:not([open])>*:not(summary){display:block}thead{display:table-header-group}tr{break-inside:avoid}.yazdir-baslik{display:block!important;font-weight:600;margin:0 0 8px}.uygulama{display:block!important}main{overflow:visible!important}.kart{break-inside:avoid;border-color:#bbb}:root{--bg:#fff}body{background:#fff!important;color:#000!important}}
</style>
</head>
<body>
<div id="yukle" role="status" aria-live="polite">
  <div class="kutu">
    <svg width="76" height="76" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 50L32 18L59 50" stroke="var(--fg)" stroke-width="6"/>
      <path d="M17 50L32 32.5L47 50" stroke="var(--fg)" stroke-width="6"/>
      <path d="M26 50L32 43L38 50Z" stroke="var(--accent)" fill="var(--accent)" stroke-width="3"/>
    </svg>
    <div class="ad">TAA Çatı</div>

  </div>
</div>

<dialog id="dogrula-d"><form method="dialog" id="dogrula-f">
  <h2>Parolanızı doğrulayın</h2>
  <p class="muted" style="margin:0;font-size:13px">Değişiklik yapmak için 15 dakikalık yönetici penceresi açılır. Parola yalnız sunucuya gider, saklanmaz.</p>
  <label class="alan">Parola<input class="girdi" name="parola" type="password" required></label>
  <div class="hata-kutu" id="dogrula-hata" role="alert"></div>

</form></dialog>

  <div class="hata-kutu" id="form-hata" role="alert"></div>
  <div class="dugmeler"><button class="dugme" value="vazgec" formnovalidate>Vazgeç</button><button class="dugme birincil" value="tamam" id="form-tamam">Kaydet</button></div>
</form></dialog>

<div class="bildirim" id="bildirim" role="status" aria-live="polite"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const kok=document.documentElement;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Görünen ad (sunucudaki ile aynı, Yusuf 11-17): ad soyadın yıldızlı maskesi. "Mehmet Ali Kaya" → "M*** A*** K***"
const gorunenOneri=g=>String(g??'').trim().split(/\s+/).filter(Boolean).map(w=>w[0].toLocaleUpperCase('tr')+'***').join(' ');
// Formda ad soyad yazılırken görünen ad, elle değiştirilmediyse öneriyle dolar.
document.addEventListener('input',e=>{const t=e.target;
  if(t.matches?.('[data-oneri-hedef]')){t.dataset.elle='1';return}
  if(!t.matches?.('[data-oneri-kaynak]'))return;
  const h=t.form?.querySelector('[data-oneri-hedef]');if(h&&!h.dataset.elle)h.value=gorunenOneri(t.value)});
const tr=s=>String(s??'').toLocaleLowerCase('tr');
const zaman=z=>z?String(z).replace('T',' ').replace(/(\.\d+)?Z$/,'').slice(0,16):'-';

const LOGO=(w,on)=>`<svg width="${w}" height="${w}" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${on?'<rect width="64" height="64" rx="14" fill="var(--accent)"/>':''}<path d="M5 50L32 18L59 50" stroke="${on?'var(--on-accent)':'var(--fg)'}" stroke-width="6"/><path d="M17 50L32 32.5L47 50" stroke="${on?'var(--on-accent)':'var(--fg)'}" stroke-width="6"/><path d="M26 50L32 43L38 50Z" stroke="${on?'var(--on-accent)':'var(--accent)'}" fill="${on?'var(--on-accent)':'var(--accent)'}" stroke-width="3"/></svg>`;
$('#marka-menu').innerHTML=LOGO(34,true);$('#marka-giris').innerHTML=LOGO(40,true);

// ---- sunucuyla konuşma ----
class ApiHata extends Error{constructor(d,v){super(v&&v.hata||('HTTP '+d));this.durum=d;this.kod=v&&v.kod}}
async function istek(yol,govde){
  const o={method:govde?'POST':'GET',credentials:'same-origin',headers:{}};
  if(govde){o.headers['Content-Type']='application/json';o.body=JSON.stringify(govde)}
  const r=await fetch(yol,o);let v=null;try{v=await r.json()}catch(e){}
  if(!r.ok)throw new ApiHata(r.status,v);return v;
}
// Yazma: sunucu 15 dk penceresi isterse (428) parola sorulur, sonra bir kez yeniden denenir.
async function api(yol,govde){
  try{return await istek(yol,govde)}catch(e){
    if(e.durum===428&&govde){if(await dogrula())return await istek(yol,govde);throw new ApiHata(0,{hata:'İşlem yapılmadı (doğrulama yapılmadı).'})}
    if(e.durum===401&&e.kod===5){girisGoster();}
    throw e;
  }
}
function dogrula(){
  return new Promise(coz=>{
    const d=$('#dogrula-d'),f=$('#dogrula-f');f.reset();$('#dogrula-hata').textContent='';
    const kapat=async ev=>{
      if(d.returnValue!=='tamam'){d.removeEventListener('close',kapat);coz(false);return}
      try{await istek('/api/dogrula',{parola:f.parola.value});f.reset();d.removeEventListener('close',kapat);coz(true)}
      catch(e){$('#dogrula-hata').textContent=e.message;d.returnValue='';d.showModal()}
    };
    d.addEventListener('close',kapat);d.showModal();f.parola.focus();
  });
}
let bt;function bildir(m,hata){const b=$('#bildirim');b.textContent=m;b.classList.toggle('hata',!!hata);b.classList.add('goster');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('goster'),hata?5000:2400)}
const hataBildir=e=>bildir(e.message||String(e),true);

// ---- durum ----
let oturum=null,saglik=null,veri={cihazlar:[],kullanicilar:[],subeler:[],yetkiler:[],roller:[],olaylar:[],pinler:[],hesaplar:[],basvurular:[],eslestirmeler:[],hatalar:[],uyari:{yeni:0,denemeler:[],sifre_degisiklikleri:[]}};
let suzgec='bekliyor',arama='',sor=null,gunlukIslem='',gunlukSon=null;
let rapor={uyg:'hepsi',donem:'30',bas:'',bit:'',liste:null,veri:null,yukleniyor:false,hata:''};
const raporQ=()=>'uygulama='+encodeURIComponent(rapor.uyg)+'&donem='+encodeURIComponent(rapor.donem)+(rapor.donem==='ozel'?'&bas='+encodeURIComponent(rapor.bas)+'&bit='+encodeURIComponent(rapor.bit):'');
const izinli=i=>!!(oturum&&oturum.izinler&&oturum.izinler.includes(i));
const EKRANLAR=[
  ['genel','Genel bakış','◐',null],['onaylar','Onay bekleyenler','✓','kullanici.yonet'],['cihazlar','Cihazlar','▣','cihaz.yonet'],['kullanicilar','Kullanıcılar','◍','kullanici.yonet'],
  ['subeler','Şubeler','⌂','kullanici.yonet'],['yetkiler','Program yetkileri','▦','program.yonet'],['pinler','Yönetici PIN\'leri','✱','program.yonet'],['gunluk','Günlük','≡','gunluk.gor'],['hatalar','Hatalar','⚠','gunluk.gor'],['raporlar','Raporlar','▤','rol:yonetici'],['ayarlar','Ayarlar','⚙',null]
];
const BILINEN=['terzitakip','tutaa','taarkod','taadon','taa-etiket','taa-giydir','taa-video'];
const PROGRAM_AD={terzitakip:'TerziTakip',tutaa:'Tutaa',taarkod:'TaaRkod',taadon:'TaaDön','taa-etiket':'TAA Etiket','taa-giydir':'TAA Giydir','taa-video':'TAA Video Yapıcı'};
// Raporlar yalnız yöneticiye görünür (asıl denetim yerel panel sunucusunda: 403).
const rolVar=r=>!!(oturum&&(oturum.roller||[]).includes(r));
const gorunur=()=>EKRANLAR.filter(e=>!e[3]||(e[3].startsWith('rol:')?rolVar(e[3].slice(4)):izinli(e[3])));
const bekleyen=()=>veri.cihazlar.filter(c=>c.durum==='bekliyor').length;
const onayBekleyen=()=>veri.hesaplar.length+veri.basvurular.length+veri.eslestirmeler.length;
const subeAd=id=>{if(id==null||id==='')return 'Merkez';const s=veri.subeler.find(x=>x.id===id);return s?s.ad:'Şube '+id};

async function yukle(ne){
  const al=async(k,yol,izin)=>{if(izin&&!izinli(izin))return;try{veri[k]=await api(yol)||[]}catch(e){if(e.durum!==401)hataBildir(e)}};
  const isler=[];
  if(ne==='hepsi'||ne==='cihaz')isler.push(al('cihazlar','/api/cihazlar','cihaz.yonet'));
  if(ne==='hepsi'||ne==='sube')isler.push(al('subeler','/api/subeler','kullanici.yonet'));
  if(ne==='hepsi'||ne==='kullanici')isler.push(al('kullanicilar','/api/kullanicilar','kullanici.yonet'),al('roller','/api/roller','kullanici.yonet'));
  if(ne==='hepsi'||ne==='onay')isler.push(al('hesaplar','/api/hesaplar','kullanici.yonet'),al('basvurular','/api/hesaplar?durum=basvuru','kullanici.yonet'),al('eslestirmeler','/api/eslestirmeler','cihaz.yonet'));
  if(ne==='hepsi'||ne==='yetki')isler.push(al('yetkiler','/api/yetkiler','program.yonet'));
  if(ne==='hepsi'||ne==='pin')isler.push(al('pinler','/api/pinler','program.yonet'));
  if(ne==='hepsi'||ne==='gunluk')isler.push(al('olaylar','/api/gunluk?limit=50'+(gunlukIslem?'&islem='+encodeURIComponent(gunlukIslem):''),'gunluk.gor'));
  if(ne==='hepsi'||ne==='uyari')isler.push(api('/api/uyarilar').then(v=>{if(v&&Array.isArray(v.denemeler))veri.uyari=v}).catch(()=>{}));
  if(ne==='hepsi'||ne==='hatalar')isler.push(al('hatalar','/api/hatalar','gunluk.gor'));
  if(ne==='hepsi')isler.push(istek('/api/saglik').then(v=>saglik=v).catch(()=>saglik={ulasildi:false}));
  await Promise.all(isler);
}

// ---- parçalar ----
function menu(aktif){
  $('#menu-ogeler').innerHTML=gorunur().map(([id,ad,ik])=>{
    const n=id==='cihazlar'?bekleyen():id==='onaylar'?onayBekleyen():id==='genel'?(veri.uyari.yeni||0):0;
    return `<button class="oge" data-git="${id}" ${id===aktif?'aria-current="page"':''}><span class="ik" aria-hidden="true">${ik}</span><span class="ad">${ad}</span>${n?`<span class="rozet" aria-label="${n} bekleyen">${n}</span>`:''}</button>`;
  }).join('');
  $('#menu-alt').innerHTML=oturum?`<span class="mono">${esc(oturum.kullanici)}</span>`:'';
}
function durumCubugu(){
  if(!saglik)return '';
  return saglik.ulasildi
    ?`<span class="durum"><span class="nokta"></span><b style="font-weight:500">Sunucu çalışıyor</b></span>`
    :`<span class="durum uyari"><span class="nokta"></span><b style="font-weight:500">Sunucuya ulaşılamadı</b></span>`;
}
const ust=(b,a)=>`<div class="ust"><div class="baslik"><h1>${b}</h1><div class="muted" style="font-size:13px">${a}</div></div>${durumCubugu()}</div>`;
const bosDurum=m=>`<div class="bos-durum">${m}</div>`;

function cihazSatir(c){
  const k=esc(c.kimlik);let sag;
  if(c.durum==='bekliyor'){
    const sb=c.istenen_sube??c.sube_id;
    sag = sor===('iptal:'+c.kimlik)
      ? `<span class="onayla-kutu">Geri alınamaz. Emin misiniz? <button class="dugme" data-vazgec>Vazgeç</button><button class="dugme tehlike dolu" data-iptal-kesin="${k}">Evet, iptal et</button></span>`
      : `<button class="dugme tehlike" data-iptal="${k}">İptal</button><button class="dugme birincil" data-onayla="${k}" data-sube="${esc(sb??'')}">Onayla</button>`;
  } else if(c.durum==='onayli'){
    sag = sor===('iptal:'+c.kimlik)
      ? `<span class="onayla-kutu">Cihaz sunucuya bağlanamaz hâle gelir. <button class="dugme" data-vazgec>Vazgeç</button><button class="dugme tehlike dolu" data-iptal-kesin="${k}">Evet, iptal et</button></span>`
      : `<span class="etk ok">Onaylı</span><button class="dugme tehlike" data-iptal="${k}">İptal et</button>`;
  } else sag='<span class="etk hata">İptal</span>';
  const ne=c.durum==='bekliyor'?'istek '+zaman(c.kayit_zamani):'son görülme '+zaman(c.son_gorulme);
  return `<div class="satir"><div class="ana"><b>${esc(c.ad||'Adsız cihaz')}</b><span>${esc(subeAd(c.istenen_sube??c.sube_id))} · ${esc(ne)}</span></div><span class="mono muted" style="font-size:12px">${k}</span>${sag}</div>`;
}

const SAYFA={
  genel(){
    const b=bekleyen();
    const kart=(e,d,a,r)=>`<div class="kart istat"><div class="etiket"><span class="nokta" style="background:var(--${r})"></span>${e}</div><div class="deger">${d}</div><div class="ayr">${a}</div></div>`;
    const olaylar=veri.olaylar.slice(0,6);
    const u=veri.uyari,yeniler=u.denemeler.filter(d=>d.yeni),sifreYeni=(u.sifre_degisiklikleri||[]).filter(d=>d.yeni);
    const denemeSay=yeniler.reduce((t,d)=>t+(+d.deneme||0),0);
    // Yusuf 11-17: hesabıma başka bilgisayardan girmeye çalışan olursa bana uyarı gelir (hesap kilitlenmez).
    // Fable Y2: şifre yöneticiye başvuruyla değiştiyse de hesap sahibi uyarılır.
    const serit=u.yeni?`<div class="uyari-serit" role="alert">${sifreYeni.length?`<h2><span class="nokta"></span>Şifreniz yöneticiye başvuruyla değiştirildi</h2>
      <p class="muted">${sifreYeni.map(d=>`${esc(zaman(d.zaman))} · ${esc(subeAd(d.sube_id))}`).join('<br>')}. Bunu siz istemediyseniz hemen yöneticinize haber verin ve şifrenizi değiştirin.</p>`:''}
      ${denemeSay?`<h2><span class="nokta"></span>Hesabınıza başka bir bilgisayardan ${denemeSay} hatalı giriş denemesi</h2>
      <p class="muted">Bu bilgisayarlar daha önce hesabınızla oturum açmadı. Hesabınız kilitlenmedi. Siz değilseniz şifrenizi değiştirin ve bilgisayarı Cihazlar'dan iptal etmeyi düşünün.</p>`:''}
      ${yeniler.map(d=>`<div class="satir"><div class="ana"><b>${esc(d.cihaz_adi||'Adsız cihaz')}</b><span>${esc(subeAd(d.sube_id))} · ${esc(d.gun)} · son deneme ${esc(zaman(d.son))}</span></div><span class="etk hata">${d.deneme} deneme</span></div>`).join('')}
      <div class="arac" style="margin-top:8px"><span style="flex:1"></span><button class="dugme" data-uyari-gordum>Gördüm</button></div></div>`:'';
    return ust('Genel bakış','Merkez sunucunun durumu · 30 saniyede bir yenilenir')+serit+`
    <div class="izgara4">
      ${kart('SUNUCU',saglik&&saglik.ulasildi?'Çalışıyor':'Ulaşılamadı',saglik&&saglik.ulasildi?'sağlık ucu yanıt verdi':esc(saglik&&saglik.hata||'bağlantı yok'),saglik&&saglik.ulasildi?'ok':'err')}
      ${izinli('cihaz.yonet')?kart('BEKLEYEN CİHAZ',b,b?'onayınızı bekliyor':'hepsi sonuçlandı',b?'warn':'ok'):''}
      ${izinli('kullanici.yonet')?kart('ŞUBE',veri.subeler.length,veri.kullanicilar.length+' kullanıcı','ok'):''}
      ${kart('OTURUM',esc(oturum.kullanici),'geçerlilik '+esc(oturum.gecerlilik?zaman(oturum.gecerlilik):'sınırsız'),'ok')}
    </div>
    <div class="iki">
      ${izinli('cihaz.yonet')?`<div class="kart"><h2>Onay bekleyen cihazlar<span class="bos"></span>${b?`<span class="etk uy">${b} yeni</span>`:'<span class="etk ok">Bekleyen yok</span>'}</h2>
        ${b?veri.cihazlar.filter(c=>c.durum==='bekliyor').map(cihazSatir).join(''):'<p class="muted">Tüm cihaz istekleri sonuçlandı.</p>'}</div>`:'<div></div>'}
      ${izinli('gunluk.gor')?`<div class="kart"><h2>Son olaylar</h2>${olaylar.length?olaylar.map(o=>`<div class="olay"><span class="mono muted" style="font-size:12px;white-space:nowrap">${esc(zaman(o.zaman).slice(11))}</span><div><b>${esc(o.islem)}</b><span>${esc(subeAd(o.sube_id))}${o.ayrinti?' · '+esc(typeof o.ayrinti==='string'?o.ayrinti:JSON.stringify(o.ayrinti)):''}</span></div></div>`).join(''):'<p class="muted">Olay yok.</p>'}</div>`:''}
    </div>`;
  },
  onaylar(){
    // Öneri en az yetkili rol: personel; yoksa yönetici olmayan ilk rol (yönetici asla önerilmez).
    const adaylar=['personel','kasa','kasiyer'],yoneticiDisi=veri.roller.filter(r=>r.ad!=='yonetici');
    const varsayilanRol=(adaylar.map(a=>veri.roller.find(r=>r.ad===a)).find(Boolean)||yoneticiDisi[yoneticiDisi.length-1]||{}).ad||'';
    const rolSec=id=>`<select class="girdi" data-onay-rol="${id}" aria-label="Rol">${veri.roller.map(r=>`<option value="${esc(r.ad)}" ${r.ad===varsayilanRol?'selected':''}>${esc(r.ad)}</option>`).join('')}</select>`;
    const subeSec=(id,sec)=>`<select class="girdi" data-onay-sube="${id}" aria-label="Şube"><option value="">Tüm şubeler</option>${veri.subeler.map(x=>`<option value="${+x.id}" ${x.id===sec?'selected':''}>${esc(x.ad)}</option>`).join('')}</select>`;
    const hesap=h=>{const id=+h.id;
      const sag=sor===('reddet:'+id)
        ?`<span class="onayla-kutu">Başvuru reddedilir. <button class="dugme" data-vazgec>Vazgeç</button><button class="dugme tehlike dolu" data-hesap-islem="reddet" data-id="${id}">Evet, reddet</button></span>`
        :`<span class="onay-sec">${rolSec(id)}${subeSec(id,h.istenen_sube)}</span><button class="dugme" data-hesap-duzenle="${id}">Düzenle</button><button class="dugme tehlike" data-sor="reddet:${id}">Reddet</button><button class="dugme birincil" data-hesap-onayla="${id}">Onayla</button>`;
      return `<div class="satir"><div class="ana"><b>${esc(h.gercek_ad||h.gorunen_ad)}</b><span><span class="mono">${esc(h.ad)}</span> · fişte ${esc(h.gorunen_ad)} · ${esc(subeAd(h.istenen_sube))} · başvuru ${esc(zaman(h.kayit_zamani))}</span></div>${sag}</div>`};
    const basvuru=h=>{const id=+h.id,sifre=h.basvuru_turu==='sifre';
      // Fable Y1: aynı hesaba birden çok başvuru geldiyse ya da başvuru kişinin şubesinden gelmediyse yönetici uyarılır.
      const dikkat=[(+h.basvuru_adet||0)>1?`Bu hesaba ${+h.basvuru_adet} başvuru geldi; yalnız sonuncusu geçerli. Güvenli yol: reddedin ve kişiden yeniden başvurmasını isteyin`:'',h.sube_uyumsuz?'Başvuru kişinin çalıştığı şubeden gelmedi':''].filter(Boolean);
      return `<div class="satir"><div class="ana"><b>${esc(h.gercek_ad||h.gorunen_ad)}</b><span><span class="mono">${esc(h.ad)}</span> · ${sifre?'Şifresini unuttu, yeni şifre belirledi':'Hesabı kilitlendi, açılmasını istiyor'} · ${esc(subeAd(h.basvuru_sube))} · ${esc(zaman(h.basvuru_zamani))}</span>${dikkat.map(t=>`<div class="not uyari" role="status">${esc(t)}</div>`).join('')}</div><button class="dugme tehlike" data-hesap-islem="basvuru-reddet" data-id="${id}">Reddet</button><button class="dugme birincil" data-basvuru-onay="${id}" data-ad="${esc(h.gercek_ad||h.gorunen_ad)}" data-dikkat="${dikkat.length?1:''}">${sifre?'Yeni şifreyi onayla':'Kilidi aç'}</button></div>`};
    const eslestirme=x=>{const id=+x.id;

    return ust('Onay bekleyenler','Kendi kaydını yapan personel ve telefon eşleştirme istekleri · onaysız hesap giremez')+`
    <div class="arac"><span class="muted">${veri.hesaplar.length} hesap · ${veri.basvurular.length} başvuru · ${veri.eslestirmeler.length} telefon</span><span style="flex:1"></span><button class="dugme" data-yenile="onay">Yenile</button></div>
    <div class="kart"><h2>Onay bekleyen hesaplar</h2>${veri.hesaplar.length?veri.hesaplar.map(hesap).join(''):'<p class="muted">Bekleyen başvuru yok. Personel mağaza bilgisayarından kullanıcı adı, ad soyad ve şifreyle kayıt olur.</p>'}</div>
    ${izinli('kullanici.yonet')?`<div class="kart"><h2>Yöneticiye başvurular</h2>${veri.basvurular.length?veri.basvurular.map(basvuru).join(''):'<p class="muted">Bekleyen başvuru yok. Şifresini unutan ya da hesabı kilitlenen personel programdaki "Yöneticiye başvur" ile buraya düşer.</p>'}</div>`:''}
    ${izinli('cihaz.yonet')?`<div class="kart"><h2>Telefon eşleştirme istekleri</h2>${veri.eslestirmeler.length?veri.eslestirmeler.map(eslestirme).join(''):'<p class="muted">Bekleyen telefon yok. Mağazada çift kodla eşleştirme yapılamıyorsa istek buraya düşer.</p>'}</div>`:''}
    <div class="ipucu"><span class="nokta"></span>Rol ve şube kaydın yapıldığı mağazaya göre önerilir. Onaylanmayan başvuru 7 gün sonra düşer. Telefon onayı için kişiden telefonunda görünen iki haneli sayıyı isteyin.</div>`;

  kullanicilar(){

    const liste=veri.kullanicilar.filter(u=>!['onay_bekliyor','reddedildi'].includes(u.durum));

    <div class="arac"><span class="muted">${liste.length} kullanıcı</span><span style="flex:1"></span><button class="dugme birincil" data-kullanici-ekle>Kullanıcı ekle</button></div>
    <div class="kart tablo-kap">${liste.length?`<table><thead><tr><th>Ad</th><th>Kullanıcı adı</th><th>Roller</th><th>Durum</th><th></th></tr></thead><tbody>
    ${liste.map(u=>{const durum=u.durum||(u.aktif===false?'kaldirildi':'aktif');const id=+u.id;const [renk,yazi]=DURUM[durum]||['hata',durum];
      const islem=sor===('kapat:'+id)
        ?`<span class="onayla-kutu">Hesap kapanır, açık oturumları hemen kesilir. <button class="dugme" data-vazgec>Vazgeç</button><button class="dugme tehlike dolu" data-kapat-kesin="${id}">Evet, kapat</button></span>`
        :u.ad===(oturum&&oturum.kullanici)?'<span class="muted" style="font-size:12px">Siz</span>'
        :durum==='aktif'?`${u.kilitli?`<button class="dugme" data-hesap-islem="kilit-ac" data-id="${id}">Kilidi aç</button> `:''}<button class="dugme" data-hesap-islem="askiya-al" data-id="${id}">Askıya al</button> <button class="dugme tehlike" data-kapat="${id}">Kapat</button>`
        :durum==='askida'?`<button class="dugme birincil" data-hesap-islem="geri-ac" data-id="${id}">Geri aç</button> <button class="dugme tehlike" data-kapat="${id}">Kapat</button>`:'';
      return `<tr><td>${esc(u.gorunen_ad)}${u.gercek_ad&&u.gercek_ad!==u.gorunen_ad?`<div class="muted" style="font-size:12px">${esc(u.gercek_ad)}</div>`:''}</td><td class="mono" style="font-size:12px">${esc(u.ad)}</td><td style="font-size:13px">${esc(rolYazi(u))}</td><td><span class="etk ${renk}">${yazi}</span>${u.kilitli?' <span class="etk uy">Kilitli</span>':''}${u.basvuru_turu?' <span class="etk uy">Başvuru bekliyor</span>':''}</td><td style="text-align:right;white-space:nowrap">${islem}</td></tr>`}).join('')}
    </tbody></table>`:bosDurum('Kullanıcı yok.')}</div>`;
  },
  subeler(){
    return ust('Şubeler','Her şubenin verisi ayrı tutulur')+`
    <div class="arac"><span class="muted">${veri.subeler.length} şube</span><span style="flex:1"></span><button class="dugme birincil" data-sube-ekle>Şube ekle</button></div>
    <div class="izgara4">${veri.subeler.map(s=>`<div class="kart istat"><div class="etiket">KOD ${esc(s.kod)}</div><div class="deger">${esc(s.ad)}</div><div class="ayr">${veri.cihazlar.filter(c=>c.sube_id===s.id&&c.durum==='onayli').length} onaylı cihaz${s.aktif===false?' · kapalı':''}</div></div>`).join('')||bosDurum('Şube yok.')}</div>`;
  },
  yetkiler(){
    const kurallar=veri.yetkiler.filter(y=>!y.rol);
    const programlar=[...new Set([...BILINEN,...veri.yetkiler.map(y=>y.program)])];
    const kural=(p,s)=>kurallar.find(y=>y.program===p&&(y.sube_id??null)===s);
    const durum=(p,s)=>{const a=kural(p,s);if(a)return{acik:!!a.acik,miras:false};const g=kural(p,null);return{acik:g?!!g.acik:true,miras:true}};
    const sutunlar=[{id:null,ad:'Tüm şubeler'},...veri.subeler];
    const rolKural=veri.yetkiler.filter(y=>y.rol);
    return ust('Program yetkileri','Hangi şube hangi programı kullanabilir · kapalı her zaman kazanır')+`
    <div class="kart tablo-kap"><table><thead><tr><th>Program</th>${sutunlar.map(s=>`<th>${esc(s.ad)}</th>`).join('')}</tr></thead><tbody>
    ${programlar.map(p=>`<tr><td><b style="font-weight:500" class="mono">${esc(p)}</b></td>${sutunlar.map(s=>{const d=durum(p,s.id);return `<td><button class="anahtar${d.miras?' miras':''}" role="switch" aria-checked="${d.acik}" aria-label="${esc(p)} · ${esc(s.ad)}${d.miras?' (genel kuraldan)':''}" data-yetki="${esc(p)}" data-sube="${esc(s.id??'')}"></button></td>`}).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="ipucu"><span class="nokta"></span>Soluk anahtar genel kuraldan gelir; dokununca o şube için ayrı kural yazılır.${rolKural.length?' Role özel '+rolKural.length+' kural komut satırından yönetilir.':''}</div>`;
  },
  gunluk(){
    return ust('Günlük','Kim, ne zaman, ne yaptı · yalnız okunur')+`
    <div class="arac"><input class="ara" style="margin-left:0" id="gunluk-islem" placeholder="İşleme göre süz (ör. giris)" value="${esc(gunlukIslem)}" aria-label="İşlem süzgeci"><button class="dugme" data-gunluk-suz>Süz</button><span style="flex:1"></span><button class="dugme" data-yenile="gunluk">Yenile</button></div>
    <div class="kart">${veri.olaylar.length?veri.olaylar.map(o=>`<div class="satir"><span class="mono muted" style="font-size:12px;min-width:120px">${esc(zaman(o.zaman))}</span><div class="ana"><b>${esc(o.islem)}</b><span>${esc(subeAd(o.sube_id))}${o.kullanici_id!=null?' · kullanıcı '+esc(o.kullanici_id):''}${o.ayrinti?' · '+esc(typeof o.ayrinti==='string'?o.ayrinti:JSON.stringify(o.ayrinti)):''}</span></div></div>`).join(''):bosDurum('Olay yok.')}</div>
    ${veri.olaylar.length>=50?'<div><button class="dugme" data-daha>Daha eski olaylar</button></div>':''}`;
  },
  hatalar(){
    return ust('Hatalar','Programlardan gelen çökme ve hata raporları · kişisel veri içermez')+`
    <div class="arac"><span style="flex:1"></span><button class="dugme" data-yenile="hatalar">Yenile</button></div>
    <div class="kart">${veri.hatalar.length?veri.hatalar.map(h=>`<div class="satir"><span class="mono muted" style="font-size:12px;min-width:120px">${esc(zaman(h.son_zaman))}</span><div class="ana"><b>${esc(PROGRAM_AD[h.program]||h.program)} ${esc(h.surum)} · ${h.tur==='cokme'?'çökme':'hata'}${h.tekrar>1?' ×'+esc(h.tekrar):''}</b><span class="mono">${esc(h.yer)} ${esc(h.mesaj)}</span></div></div>`).join(''):bosDurum('Hata raporu yok.')}</div>`;
  },
  pinler(){
    const programlar=[...new Set([...BILINEN,...veri.pinler.map(p=>p.program)])];
    const kayit=(p,sid)=>veri.pinler.find(x=>x.program===p&&(x.sube_id??null)===sid&&x.belirlendi);
    const satir=(p,sid)=>{const k=kayit(p,sid);const ad=sid==null?'Tüm şubeler':subeAd(sid);
      return `<div class="satir"><div class="ana"><b>${esc(ad)}</b><span class="pin-durum ${k?'var':'yok'}">${k?'Belirlendi · '+esc(zaman(k.guncellendi))+(k.guncelleyen?' · '+esc(k.guncelleyen):''):(sid==null?'Belirlenmedi · bu programda yönetici işlemleri kilitli':'Belirlenmedi')}</span></div>
      <button class="dugme${k?'':' birincil'}" data-pin-belirle="${esc(p)}" data-sube="${esc(sid??'')}">${k?'Değiştir':'Belirle'}</button>${k?`<button class="dugme tehlike" data-pin-kaldir="${esc(p)}" data-sube="${esc(sid??'')}">Kaldır</button>`:''}</div>`};
    return ust('Yönetici PIN\'leri','Programlardaki yönetici işlemleri bu PIN\'le açılır · yalnız buradan belirlenir')+
    programlar.map(p=>{const ozel=veri.pinler.filter(x=>x.program===p&&x.sube_id!=null&&x.belirlendi);
      return `<div class="kart"><h2>${esc(PROGRAM_AD[p]||p)} <span class="mono muted" style="font-size:12px;font-weight:400">${esc(p)}</span><span class="bos"></span><button class="dugme" data-pin-belirle="${esc(p)}" data-sube-sec="1">Şubeye özel PIN</button></h2>
      ${satir(p,null)}${ozel.map(x=>satir(p,x.sube_id)).join('')}</div>`}).join('')+
    `<div class="ipucu"><span class="nokta"></span>PIN sunucuda geri çevrilemez biçimde saklanır, kimse göremez; unutulursa yenisi belirlenir. Şubeye özel PIN, o şubede genel PIN'in yerine geçer. Bir cihazda 5 yanlış denemede o cihaz 5 dakika bekler.</div>`;
  },
  raporlar(){
    const SEV={'uyarı':['hata','Uyarı'],'dikkat':['uy','Dikkat'],'bilgi':['ok','Bilgi']};
    const r=rapor,hazir=!!r.veri&&!r.yukleniyor&&!r.hata,liste=(r.liste&&r.liste.uygulamalar)||[];
    const secici=`<label class="alan" style="min-width:220px">Uygulama<select class="girdi" id="rapor-uyg"><option value="hepsi" ${r.uyg==='hepsi'?'selected':''}>Tüm uygulamalar</option>${liste.map(u=>`<option value="${esc(u.kimlik)}" ${r.uyg===u.kimlik?'selected':''}>${esc(u.ad)}</option>`).join('')}</select></label>`;
    const arac=`<div class="kart"><div class="arac" style="align-items:end">${secici}<div class="segment" role="group" aria-label="Dönem">${[['bugun','Bugün'],['7','7 gün'],['30','30 gün'],['ozel','Özel']].map(([d,ad])=>`<button data-rapor-donem="${d}" aria-pressed="${r.donem===d}">${ad}</button>`).join('')}</div>
      ${r.donem==='ozel'?`<label class="alan">Başlangıç<input class="girdi" type="date" id="rapor-bas" value="${esc(r.bas)}"></label><label class="alan">Bitiş<input class="girdi" type="date" id="rapor-bit" value="${esc(r.bit)}"></label>`:''}
      <span style="flex:1"></span>
      <button class="dugme" data-rapor-yenile ${r.yukleniyor?'disabled':''}>${r.yukleniyor?'Hazırlanıyor…':'Yenile'}</button>
      ${hazir?`<a class="dugme birincil" style="text-decoration:none" href="/api/raporlar/xlsx?${raporQ()}" download>Excel (.xlsx) indir</a>
      <a class="dugme" style="text-decoration:none;color:inherit" href="/api/raporlar/csv?${raporQ()}" download>CSV</a>`:`<button class="dugme birincil" disabled>Excel (.xlsx) indir</button><button class="dugme" disabled>CSV</button>`}
      <button class="dugme" data-rapor-yazdir ${hazir?'':'disabled'}>Yazdır / PDF</button></div>
      ${r.veri&&r.guncellendi?`<div class="muted" style="font-size:12px;margin-top:8px">Gösterilen dönem: <b>${esc(r.veri.donem.bas===r.veri.donem.bit?r.veri.donem.bas:r.veri.donem.bas+' – '+r.veri.donem.bit)}</b> · Son yenileme: ${esc(r.guncellendi)}${r.yukleniyor?' · yenileniyor…':''}</div>`:''}
      <div class="muted" style="font-size:12px;margin-top:8px">Rapor bu bilgisayardaki veriden hazırlanır; internete ya da yapay zekâya gönderilmez. Excel dosyasında özet, bölümler, yorumlar ve grafik verisi ayrı sayfalardadır. PDF için yazdırma penceresinde "PDF olarak kaydet" seçin.</div></div>`;
    if(r.hata)return ust('Raporlar','Tüm TAA uygulamalarından · yalnız yöneticiler')+arac+`<div class="kart"><div class="hata-kutu" style="display:block" role="alert">${esc(r.hata)}</div></div>`;
    if(!r.veri)return ust('Raporlar','Tüm TAA uygulamalarından · yalnız yöneticiler')+arac+bosDurum('Rapor hazırlanıyor…');
    const v=r.veri,uygAd=r.uyg==='hepsi'?'Tüm uygulamalar':((liste.find(u=>u.kimlik===r.uyg)||{}).ad||r.uyg),sayac=(u,sv)=>u.yorumlar.filter(y=>y.seviye===sv).length;
    const ozet=`<div class="yazdir-baslik">TAA Raporu · ${esc(uygAd)} · ${esc(v.donem.bas===v.donem.bit?v.donem.bas:v.donem.bas+' – '+v.donem.bit)}</div><div class="kart"><h2>Özet <span class="muted" style="font-size:12px;font-weight:400">${esc(v.donem.bas===v.donem.bit?v.donem.bas:v.donem.bas+' – '+v.donem.bit)}</span></h2>${v.uygulamalar.map(u=>{
      const uy=sayac(u,'uyarı'),di=sayac(u,'dikkat');
      return `<div class="satir"><div class="ana"><b>${esc(u.ad)}</b><span>${esc(u.aciklama)}</span></div>${uy?`<span class="etk hata">${uy} uyarı</span>`:''}${di?`<span class="etk uy">${di} dikkat</span>`:''}${!uy&&!di?(u.bolumler.every(b=>b.durum==='yok')?'<span class="etk" style="color:var(--muted)">Veri yok</span>':u.bolumler.some(b=>b.durum==='hata')?'<span class="etk hata">Okunamadı</span>':u.bolumler.some(b=>b.durum==='yok')?'<span class="etk uy">Kısmi veri</span>':'<span class="etk ok">Sorun yok</span>'):''}</div>`}).join('')}</div>`;
    const grafik=g=>{
      const n=g.noktalar;if(!n.length)return '';
      const mx=Math.max(...n.map(x=>x.deger),1),W=Math.max(320,n.length*38),H=132,gen=Math.min(26,Math.floor((W-20)/n.length)-6);
      const bicim=d=>Number.isInteger(d)?String(d):d.toLocaleString('tr',{maximumFractionDigits:2});
      const cubuk=n.map((x,i)=>{const h=Math.round(x.deger/mx*(H-34)),px=10+i*((W-20)/n.length)+((W-20)/n.length-gen)/2;
        return `<g><title>${esc(x.etiket)}: ${esc(bicim(x.deger))} ${esc(g.birim)}</title><rect x="${px}" y="${H-18-h}" width="${gen}" height="${Math.max(h,1)}" rx="3" fill="var(--accent)" opacity=".85"/><text x="${px+gen/2}" y="${H-18-h-3}" text-anchor="middle" font-size="12" fill="var(--fg)">${esc(bicim(x.deger))}</text><text x="${px+gen/2}" y="${H-5}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(String(x.etiket).length>10&&/^\d{4}-/.test(x.etiket)?x.etiket.slice(5):x.etiket)}</text></g>`}).join('');
      return `<div style="margin-top:14px"><b style="font-weight:500;font-size:13px">${esc(g.baslik)}</b> <span class="muted" style="font-size:12px">(${esc(g.birim)})</span><div style="overflow-x:auto" class="grafik-kap"><svg role="img" aria-label="${esc(g.baslik)}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${cubuk}</svg></div><details style="margin-top:4px"><summary class="muted" style="font-size:12px;cursor:pointer">Tablo olarak göster</summary><table style="border-collapse:collapse;font-size:13px;margin-top:4px"><tbody>${n.map(x=>`<tr><td style="padding:2px 12px 2px 0">${esc(x.etiket)}</td><td class="mono" style="text-align:right">${esc(bicim(x.deger))} ${esc(g.birim)}</td></tr>`).join('')}</tbody></table></details></div>`};
    const bolum=b=>{
      const dur=b.durum==='var'?'':`<span class="etk ${b.durum==='hata'?'hata':'uy'}">${b.durum==='hata'?'Okunamadı':'Veri yok'}</span>`;
      const sat=b.satirlar.map(x=>`<tr><td>${esc(x.anahtar)}</td><td class="mono" style="text-align:right">${esc(x.deger)}</td></tr>`).join('');
      return `<div style="margin-top:12px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-weight:500">${esc(b.baslik)}</b>${dur}</div>
        ${sat?`<div class="tablo-kap"><table style="width:100%;border-collapse:collapse;font-size:13px"><tbody>${sat}</tbody></table></div>`:''}
        ${b.uyarilar.map(x=>`<div class="muted" style="font-size:12px;margin-top:4px">${esc(x)}</div>`).join('')}</div>`};
    const detay=v.uygulamalar.map(u=>{
      const y=u.yorumlar.slice().sort((a,b)=>['uyarı','dikkat','bilgi'].indexOf(a.seviye)-['uyarı','dikkat','bilgi'].indexOf(b.seviye));
      return `<div class="kart rapor-kart"><h2>${esc(u.ad)}</h2>
        ${y.length?y.map(k=>`<div class="satir"><span class="etk ${(SEV[k.seviye]||SEV.bilgi)[0]}">${(SEV[k.seviye]||SEV.bilgi)[1]}</span><div class="ana"><b>${esc(k.metin)}</b></div></div>`).join(''):'<div class="muted" style="font-size:13px">Olağan dışı bir durum yok.</div>'}
        ${(u.grafikler||[]).map(grafik).join('')}
        ${u.bolumler.map(bolum).join('')}</div>`}).join('');
    return ust('Raporlar','Tüm TAA uygulamalarından · yalnız yöneticiler')+arac+ozet+detay;
  },

async function raporYukle(){
  rapor.yukleniyor=true;rapor.hata='';
  try{
    if(!rapor.liste)rapor.liste=await istek('/api/raporlar/liste');
    rapor.veri=await istek('/api/raporlar?'+raporQ());
  }catch(err){rapor.hata=err.message||'Rapor alınamadı'}
  rapor.yukleniyor=false;if(!rapor.hata)rapor.guncellendi=new Date().toLocaleString('tr');if(aktifEkran()==='raporlar')ciz();
}
function aktifEkran(){const h=location.hash.slice(1);return gorunur().some(e=>e[0]===h)?h:'genel'}
function ciz(odak){
  if(!oturum)return;
  const e=aktifEkran();menu(e);
  $('#ana').innerHTML=`<div class="ekran">${SAYFA[e]()}</div>`;
  if(e==='raporlar'&&!rapor.veri&&!rapor.yukleniyor&&!rapor.hata)raporYukle();
  if(odak){const a=$('#ara');if(a){a.focus();a.setSelectionRange(a.value.length,a.value.length)}}
}
// ---- görünüm ---- tercih veri kökünde cati/gorunum.json (yerel panel /api/gorunum); kontrast düzeltmesi sunucu tarafında.
let gor={tema:'kule',kip:'tema',hareketi_azalt:null,tanitim_goruldu:true,ozel_vurgu:{},vurgular:{}};
const sistemKoyu=matchMedia('(prefers-color-scheme: dark)');
const sistemAz=matchMedia('(prefers-reduced-motion: reduce)');
function koyuMu(){return gor.kip==='koyu'||(gor.kip==='tema'&&gor.tema==='kule')||(gor.kip==='sistem'&&sistemKoyu.matches)}
function hareketAz(){return gor.hareketi_azalt==null?sistemAz.matches:gor.hareketi_azalt}
function vurguDurum(){const o=(gor.ozel_vurgu||{})[gor.tema]||null;const v=((gor.vurgular||{})[gor.tema]||{})[koyuMu()?'koyu':'acik']||{};return{ozel:o,renk:v.renk||getComputedStyle(kok).getPropertyValue('--accent').trim(),yazi:v.yazi,durum:v.durum||'tema'}}
function gorUygula(){
  const t=['kule','defter','tas'].includes(gor.tema)?gor.tema:'kule';
  kok.dataset.tema=t;kok.dataset.kip=koyuMu()?'koyu':'acik';
  kok.style.removeProperty('--accent');kok.style.removeProperty('--on-accent');
  const v=vurguDurum();
  if(v.durum==='uygun'||v.durum==='duzeltildi'){kok.style.setProperty('--accent',v.renk);if(v.yazi)kok.style.setProperty('--on-accent',v.yazi)}
  kok.classList.toggle('az-hareket',gor.hareketi_azalt===true);
  kok.classList.toggle('hareket-normal',gor.hareketi_azalt===false);
}
sistemKoyu.addEventListener('change',()=>{if(gor.kip==='sistem'){gorUygula();ciz()}});
async function gorKaydet(degisim,ileti){
  const once=gor;
  try{gor=await istek('/api/gorunum',degisim);gorUygula();ciz();
    const d=vurguDurum().durum;
    if('vurgu' in degisim&&d==='duzeltildi')bildir('Okunabilirlik için renk biraz ayarlandı');
    else if('vurgu' in degisim&&d==='reddedildi')bildir('Bu renk okunamıyor; temanın rengi kullanılıyor',true);
    else if(ileti)bildir(ileti);
  }catch(e){gor=once;gorUygula();hataBildir(e)}
}

let tanitimSira=0,tanitimBitince=null;
function tanitimCiz(gecis){
  const kutu=$('#tanitim-sahne'),[b,a,ik]=SAHNELER[tanitimSira];
  const yaz=()=>{kutu.className='sahne';
    kutu.innerHTML=`<div class="simge" aria-hidden="true"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ik}</svg></div><h2 id="tanitim-baslik">${b}</h2><p>${a}</p>`;
    if(gecis&&!hareketAz()){void kutu.offsetWidth;kutu.classList.add('gir')}};
  if(gecis&&!hareketAz()){kutu.classList.remove('gir');kutu.classList.add('cik');setTimeout(yaz,parseInt(getComputedStyle(kok).getPropertyValue('--t-dur'))||150)}else yaz();
  [...$('#tanitim-nokta').children].forEach((n,i)=>n.classList.toggle('aktif',i===tanitimSira));
  $('#tanitim-ileri').textContent=tanitimSira===SAHNELER.length-1?'Başla':'İleri';
  $('#tanitim-atla').hidden=tanitimSira===SAHNELER.length-1;
}
function tanitimGoster(){return new Promise(coz=>{tanitimSira=0;tanitimBitince=coz;$('#tanitim').hidden=false;tanitimCiz(false);$('#tanitim-ileri').focus()})}
function tanitimKapat(){
  $('#tanitim').hidden=true;
  if(!gor.tanitim_goruldu){gor.tanitim_goruldu=true;istek('/api/gorunum',{tanitim_goruldu:true}).then(v=>{gor=v}).catch(()=>{})}
  const c=tanitimBitince;tanitimBitince=null;if(c)c();
}
$('#tanitim-ileri').addEventListener('click',()=>{if(tanitimSira<SAHNELER.length-1){tanitimSira++;tanitimCiz(true)}else tanitimKapat()});
$('#tanitim-atla').addEventListener('click',tanitimKapat);
$('#tanitim').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();tanitimKapat()}if(e.key==='ArrowRight')$('#tanitim-ileri').click();if(e.key==='Tab'){e.preventDefault();const d=[...$('#tanitim').querySelectorAll('button:not([hidden])')];const i=d.indexOf(document.activeElement);d[(i+(e.shiftKey?d.length-1:1))%d.length].focus()}});

function formAc(baslik,govde,kaydet,dugme){

  const kapat=async()=>{

    if('daha' in ds){const son=veri.olaylar[veri.olaylar.length-1];if(!son)return;d.disabled=true;
      const ek=await api('/api/gunluk?limit=50&onceki_id='+(+son.id)+(gunlukIslem?'&islem='+encodeURIComponent(gunlukIslem):''));veri.olaylar=veri.olaylar.concat(ek||[]);ciz();return}
    if(ds.temaSec){await gorKaydet({tema:ds.temaSec},'Tema değişti');return}
    if(ds.kip){await gorKaydet({kip:ds.kip});return}
    if(ds.hareket){await gorKaydet({hareketi_azalt:JSON.parse(ds.hareket)});return}
    if('vurguSifirla' in ds){await gorKaydet({vurgu:null},'Temanın rengine dönüldü');return}
    if('tanitim' in ds){await tanitimGoster();d.disabled=false;return}
    if('sifirla' in ds){try{gor=await istek('/api/gorunum/sifirla',{});gorUygula();ciz();bildir('Varsayılan ayarlara dönüldü')}catch(err){hataBildir(err)}return}
    if(ds.pinBelirle){
      const p=ds.pinBelirle,secili=ds.subeSec?undefined:sayi(ds.sube),ad=PROGRAM_AD[p]||p;
      const subeAlani=ds.subeSec?`<label class="alan">Şube<select class="girdi" name="sube_id" required>${veri.subeler.map(x=>`<option value="${+x.id}">${esc(x.ad)} (${esc(x.kod)})</option>`).join('')}</select></label>`:`<div class="muted" style="font-size:13px">${esc(secili==null?'Tüm şubeler':subeAd(secili))}</div>`;
      formAc(ad+' yönetici PIN\'i',`${subeAlani}
        <label class="alan">Yeni PIN (4-8 rakam)<input class="girdi mono" name="pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></label>
        <label class="alan">PIN tekrar<input class="girdi mono" name="pin2" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></label>
        <div class="muted" style="font-size:12px">0000 ya da 1234 gibi kolay tahmin edilen PIN'ler kabul edilmez.</div>`,
        async f=>{if(f.pin.value!==f.pin2.value)throw new Error('İki PIN aynı değil.');const z=pinZayif(f.pin.value);if(z)throw new Error(z);
          const sid=ds.subeSec?sayi(f.sube_id.value):secili;
          await api('/api/pin',{program:p,pin:f.pin.value,sube_id:sid});f.reset();await yukle('pin');ciz();bildir('PIN belirlendi')},'Kaydet');
      return}
    if(ds.pinKaldir){
      const p=ds.pinKaldir,sid=sayi(ds.sube),ad=PROGRAM_AD[p]||p;
      formAc('PIN kaldırılsın mı?',`<div>${esc(ad)} · ${esc(sid==null?'Tüm şubeler':subeAd(sid))}</div><div class="muted" style="font-size:13px">${sid==null?'Genel PIN kalkınca şubeye özel PIN\'i olmayan şubelerde bu programın yönetici işlemleri kilitlenir.':'Bu şubede genel PIN geçerli olur.'}</div>`,
        async()=>{await api('/api/pin/kaldir',{program:p,sube_id:sid});await yukle('pin');ciz();bildir('PIN kaldırıldı')},'Kaldır');
      return}
    if('cikis' in ds){await istek('/api/cikis',{});oturum=null;girisGoster();return}
    if('panelKapat' in ds){try{await istek('/api/kapat',{})}catch(e){}document.body.innerHTML='<p style="padding:32px;font:16px system-ui">Panel kapandı. Bu pencereyi kapatabilirsiniz.</p>';window.close();return}
  }catch(err){d.disabled=false;hataBildir(err)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='ara'){arama=e.target.value;ciz(true)}
  if(e.target.id==='vurgu'){kok.style.setProperty('--accent',e.target.value)}
});
// Renk seçici: sürüklerken önizleme, bırakınca kaydet (sunucu kontrastı düzeltir ya da reddeder).
document.addEventListener('change',e=>{if(e.target.id==='vurgu')gorKaydet({vurgu:e.target.value});
  if(e.target.id==='rapor-bas'||e.target.id==='rapor-bit'){rapor[e.target.id==='rapor-bas'?'bas':'bit']=e.target.value;if(rapor.bas&&rapor.bit){rapor.veri=null;rapor.hata='';ciz()}}
  if(e.target.id==='rapor-uyg'){rapor.uyg=e.target.value;rapor.veri=null;rapor.hata='';ciz()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='gunluk-islem'){$('[data-gunluk-suz]').click()}});
window.addEventListener('hashchange',()=>{sor=null;ciz();$('#ana').focus({preventScroll:true})});

// ---- giriş ----
function girisGoster(sunucu){
  $('#uygulama').hidden=true;$('#giris').hidden=false;
  if(sunucu)$('#giris-sunucu').textContent='Sunucu: '+sunucu;
  setTimeout(()=>$('#giris-form').kullanici.focus(),0);
}
$('#giris-form').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;$('#giris-hata').textContent='';
  try{
    oturum=await istek('/api/giris',{kullanici:f.kullanici.value.trim(),parola:f.parola.value,kod:f.kod.value.trim()||null});
    f.reset();await basla();
  }catch(err){$('#giris-hata').textContent=err.message}finally{b.disabled=false;f.parola.value=''}
});

async function basla(){
  $('#giris').hidden=true;$('#uygulama').hidden=false;
  await yukle('hepsi');ciz();
}
async function ac(){
  try{gor=await istek('/api/gorunum')}catch(e){}
  gorUygula();
  const az=hareketAz();
  const bitir=()=>setTimeout(async()=>{$('#yukle').classList.add('bitti');if(!gor.tanitim_goruldu){const o=document.activeElement;await tanitimGoster();if(!$('#giris').hidden)$('#giris-form').kullanici.focus();else if(o)o.focus()}},az?0:500);
  try{
    const o=await istek('/api/oturum');
    if(!o.girisli){bitir();girisGoster(o.sunucu);return}
    oturum=o;$('#yukle-adim').textContent='Sunucuya bağlanılıyor…';
    await basla();
  }catch(e){girisGoster();$('#giris-hata').textContent=e.message}
  bitir();
}
// Pencere açıkken yerel panel canlı kalır; ekran görünürken veriler yenilenir.
setInterval(async()=>{
  try{const o=await istek('/api/oturum');if(oturum&&!o.girisli){oturum=null;girisGoster(o.sunucu);return}
    if(oturum&&!document.hidden&&!document.querySelector('dialog[open]')&&!sor){await yukle('hepsi');const a=document.activeElement;if(!a||a===document.body||a.id==='ana')ciz()}}catch(e){}
},30000);
ac();
</script>
</body>
</html>
