# taa-kasa: TAA Kasa çekirdeği (eski TaaKasaDefteri korunur). Sahip: Yusuf. yazan: [Claude#taa-paket-yeni 2026-11-04]. güncelleme: [Claude#taa-kasa-KS2 2026-11-26] gün sonu, masraf, kuyruk, matris, xlsx; yeni dış bağımlılık yok. [Claude#taa-kasa-KS2 2026-11-26] telefon_imza: sha2 (çalışma alanında var).
[package]
name = "taa-kasa"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA Kasa çekirdeği: açılış, sayım, devir, masraf, gün sonu karşılaştırması, kuyruk, matris, xlsx (eski TaaKasaDefteri korunur)"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taa-ayar = { path = "../taa-ayar" }
taa-dosya = { path = "../taa-dosya" }
# Telefonla imza özeti (SHA-256): sha2 çalışma alanında zaten var.
sha2 = "0.10"
# Nebim kasa Excel içe aktarma (Tutaa kasa-excel.js karşılığı); çalışma alanında zaten var.
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
