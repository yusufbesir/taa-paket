# taa-katalog: Nebim aynası ürün kataloğu (salt okunur, yerel JSON). Sahip: Yusuf. yazan: [Claude#taa-paket-yeni 2026-11-04].
[package]
name = "taa-katalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ortak ürün kataloğu (Nebim dışa aktarımından beslenir)"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taa-nebim = { path = "../taa-nebim" }
taa-dosya = { path = "../taa-dosya" }
taa-ayar = { path = "../taa-ayar" }
