# taa-kuyruk: merkez sunucuya giden yerel kuyruk (çevrimdışı, idempotent). Sahip: Yusuf. yazan: [Claude#taa-kuyruk-T6 2026-11-06]
# Değişiklik: Yusuf'un kuralları çerçevesinde; bağımlılık eklemek Yusuf'a sorularak. HTTP için yeni crate yok: curl.
[package]
name = "taa-kuyruk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA giden kuyruğu: merkez sunucuya gönderilecek kayıtlar yerelde birikir, bağlantı gelince no ile idempotent gönderilir"

[lib]
name = "taa_kuyruk"
path = "src/lib.rs"

[[bin]]
name = "taa-kuyruk"
path = "src/main.rs"

[dependencies]
serde_json = "1"
taa-dosya = { path = "../taa-dosya" }
