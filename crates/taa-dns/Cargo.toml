# taa-dns: dinamik DNS güncelleyici (DuckDNS tipi ücretsiz sağlayıcılar ya da kendi güncelleme adresi).
# Sahip: Yusuf. yazan: [Claude#dinamik-adres 2026-11-25]. Yeni dış crate yok (curl komutu, taa-kuyruk gibi).
[package]
name = "taa-dns"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA dinamik DNS: sunucunun genel IP'sini DuckDNS tipi sağlayıcıya bildirir (sağlayıcı değiştirilebilir, belirteç dosyada)"

[lib]
name = "taa_dns"
path = "src/lib.rs"

[[bin]]
name = "taa-dns"
path = "src/main.rs"

# Pencere açmadan `taa-dns guncelle` çalıştıran başlatıcı (zamanlanmış görev bunu çağırır).
[[bin]]
name = "taa-dns-arka"
path = "src/arka_main.rs"

[dependencies]
serde_json = "1"
taa-dosya = { path = "../taa-dosya" }
