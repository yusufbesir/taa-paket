gerektirir = { "taa-hata" = "1", "taa-ihbar" = "1", "taa-kimlik" = "1", "taa-rehber-model" = "1", "taa-yol" = "1" }
ozellikler = ["rehber-panel"]
program = "taarehber"
sunar = []
ister = []
veri_sahibi = []
veri_okur = []
ayar_alani = "programlar.taarehber"
