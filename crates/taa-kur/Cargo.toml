# taa-kur: TAA kurulum yöneticisi (kütüphane + CLI). Sahip: Yusuf. yazan: [Claude#taa-paket-T1 2026-11-05] değiştiren: [Claude#kurucu-arayuz 2026-11-17] (taa-kur-tema, windows-sys özellikleri)
# Değişiklik: Yusuf'un kuralları çerçevesinde; bağımlılık eklemek Yusuf'a sorularak.
[package]
name = "taa-kur"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA kurulum yöneticisi: paket kurma, sürüm seçme, geri dönme, doğrulama"
build = "build.rs"

[lib]
name = "taa_kur"
path = "src/lib.rs"

[[bin]]
name = "taa-kur"
path = "src/main.rs"

[[bin]]
name = "taa-kur-pencere"
path = "src/pencere_main.rs"

[dependencies]
taa-hata = { path = "../taa-hata" }
taa-ayar = { path = "../taa-ayar" }
taa-dosya = { path = "../taa-dosya" }
taa-imza = { path = "../taa-imza" }
# T5: paket raporu (`taa-kur rapor`, pencerede Rapor düğmesi). Aynı çalışma alanı, yeni dış bağımlılık yok.
taa-rapor = { path = "../taa-rapor" }
# S3a: kurulumda cihaz anahtarı üretimi ve sunucuya kayıt (`taa-kur cihaz`). Yeni dış bağımlılık yok.
taa-cihaz = { path = "../taa-cihaz" }
# S4a: ulaşım yolu listesi ve sunucu CA sertifikası dağıtımı (`taa-kur yol`). Yeni dış bağımlılık yok.
taa-yol = { path = "../taa-yol" }
# Kurucu arayüzü (2026-11-17, Claude#kurucu-arayuz): üç tema, jetonlar, görünüm tercihi, Geçme Temel logosu. Aynı
# çalışma alanı, bağımlılıksız (yalnız std); yeni dış bağımlılık yok.
taa-kur-tema = { path = "../taa-kur-tema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# taa-donustur ile AYNI sürüm ve özellikler (T2 PR-A2: zip paket kurulumu). Başka özellik yok.
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# T3 (Yusuf onaylı): kök\kur.toml okumak için. Yalnız ayrıştırma; yazma/biçimleme özellikleri kapalı.
toml = { version = "0.8", default-features = false, features = ["parse"] }

# HD exe simgesi (2026-11-17, Claude#kurucu-arayuz): build.rs simge kaynağını aynı crate'le üretir; yeni dış bağımlılık yok.
[build-dependencies]
taa-kur-tema = { path = "../taa-kur-tema" }

# T3-pencere: Win32 penceresi doğrudan windows-sys ile (Yusuf onayladı; zip'in dolaylı sürümüyle aynı, 0.61). Yalnız Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Kurucu arayüzü özellikleri (Claude#kurucu-arayuz 2026-11-17): koyu başlık çubuğu (Dwm), pano (DataExchange, Memory,
# Ole: CF_UNICODETEXT), sistem koyu modu (Registry), Yüksek Karşıtlık (Accessibility), DPI (HiDpi).
