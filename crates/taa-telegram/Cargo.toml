# taa-telegram: TaaTerzi iç işlemleri için Telegram botu çekirdeği. Sahip: Yusuf. yazan: [Claude#taa-paket-yeni 2026-11-05].
[package]
name = "taa-telegram"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TaaTelegram çekirdeği: terzihane fişleri için bot komutları (webhook yanıtı üretir)"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taa-ayar = { path = "../taa-ayar" }
taa-dosya = { path = "../taa-dosya" }
taa-fis = { path = "../taa-fis" }
taa-bildirim = { path = "../taa-bildirim" }
taa-takip = { path = "../taa-takip" }
