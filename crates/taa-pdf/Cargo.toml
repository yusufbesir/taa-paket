# taa-pdf: PDF birleştir/böl/sırala/sıkıştır (TaaPDF çekirdeği). Sahip: Yusuf. yazan: [Claude#taa-paket-yeni 2026-11-04].
[package]
name = "taa-pdf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TaaPDF çekirdeği"

[lib]
path = "src/lib.rs"

[dependencies]
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
taa-ayar = { path = "../taa-ayar" }
taa-dosya = { path = "../taa-dosya" }
