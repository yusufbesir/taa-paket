# taa-fis: TaaFiş çekirdeği: terzi fişi, defter, termal çıktı. Sahip: Yusuf. yazan: [Claude#taa-paket-yeni 2026-11-04].
[package]
name = "taa-fis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TaaFiş çekirdeği: terzi fişi, defter, termal çıktı"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
taa-ayar = { path = "../taa-ayar" }
taa-terzi = { path = "../taa-terzi" }
taa-dosya = { path = "../taa-dosya" }
# Ad denetiminde Unicode birleşik işaret (M) sınıfı (Hintçe virama, Arapça hareke); Cargo.lock'ta zaten var (stringprep).
unicode-properties = "0.1"
