# taa-kasa-ekran: TAA Kasa programı (gün sonu, açılış, sayım, masraf). Sahip: Yusuf. yazan: [Claude#taa-kasa-KS2 2026-11-26].
# Yeni dış bağımlılık yok: tiny_http, getrandom, sha2 çalışma alanında zaten kullanılıyor (taa-cati, taa-fis-sunucu).
[package]
name = "taa-kasa-ekran"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA Kasa: gün sonu kasa programı (yerel 127.0.0.1 ekran, gömülü pencere)"

[lib]
name = "taa_kasa_ekran"
path = "src/lib.rs"

[[bin]]
name = "taa-kasa"
path = "src/main.rs"

[dependencies]
taa-kasa = { path = "../taa-kasa" }
taa-dosya = { path = "../taa-dosya" }
taa-hata = { path = "../taa-hata" }
taa-imza = { path = "../taa-imza" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"
tiny_http = "0.12"
# Sunucuya şifreli kasa yedeği (src/yedek.rs): taa-yedek ile aynı "TAAY1" biçimi. taa-yedek başka programın (taayedek)
# crate'i olduğu için bağlanmaz (sözleşme denetimi); şifre kütüphanesi çalışma alanında zaten var (taa-yedek, taa-kuyruk).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "stream"] }
