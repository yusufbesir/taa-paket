# taa-yedek: klasör yedekleme, SHA256 doğrulama, güvenli geri yükleme. Sahip: Yusuf. yazan: [Claude#taa-paket-yeni 2026-11-04].
[package]
name = "taa-yedek"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TaaYedek çekirdeği: yedekle, doğrula, geri yükle (hiçbir şey silmez)"

[lib]
path = "src/lib.rs"

[dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
taa-ayar = { path = "../taa-ayar" }
taa-dosya = { path = "../taa-dosya" }
