# Sahip: Yusuf. yazan: [Claude#ihbar 2026-11-26]
# taa-ihbar: ihbar hattı çekirdeği (RH12a-b). Yeni bağımlılık yok (serde, serde_json, sha2, taa-ayar, taa-dosya zaten kullanılıyor).
[package]
name = "taa-ihbar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA ihbar hattı çekirdeği: anonim kayıt, yalnız-ekleme defter, maskeli bildirim, hız sınırı (ağ yok)"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
taa-ayar = { path = "../taa-ayar" }
taa-dosya = { path = "../taa-dosya" }
