# taa-egitim-panel: TAA Eğitim'in yerel grafik paneli (127.0.0.1 + Edge uygulama penceresi).
# Sahip: Yusuf. yazan: [Claude#egitim-panel 2026-11-26]
# Yeni dış bağımlılık yok: tiny_http, getrandom, serde, serde_json çalışma alanında zaten kullanılıyor.
[package]
name = "taa-egitim-panel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA Eğitim paneli: video listesi, oynatıcı (Range), atamalar, izleme özeti ve video atama (yerel panel)"

[lib]
name = "taa_egitim_panel"
path = "src/lib.rs"

[[bin]]
name = "taa-egitim-panel"
path = "src/panel_main.rs"

[dependencies]
taa-egitim = { path = "../taa-egitim" }
taa-hata = { path = "../taa-hata" }
taa-kimlik = { path = "../taa-kimlik" }
taa-rehber-model = { path = "../taa-rehber-model" }
taa-yol = { path = "../taa-yol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tiny_http = "0.12"
