# taa-cihaz: şube PC'sinin cihaz kimliği (ed25519) ve istek imzalama. Sahip: Yusuf. yazan: [Claude#taa-cihaz-S2 2026-11-06]
# Değişiklik: Yusuf'un kuralları çerçevesinde; bağımlılık eklemek Yusuf'a sorularak. Yeni crate yok: taa-imza (ed25519-dalek onaylı).
[package]
name = "taa-cihaz"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA cihaz kimliği: kurulumda üretilen ed25519 anahtarla her isteği imzalar (VPN yerine); sunucuya cihaz kaydı"

[lib]
name = "taa_cihaz"
path = "src/lib.rs"

[[bin]]
name = "taa-cihaz"
path = "src/main.rs"

[dependencies]
serde_json = "1"
taa-dosya = { path = "../taa-dosya" }
taa-imza = { path = "../taa-imza" }
taa-kuyruk = { path = "../taa-kuyruk" }
