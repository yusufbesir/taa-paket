# taa-hata: ortak hata raporlama (çökme/hata -> temizlenmiş rapor -> yerel kuyruk -> TAA Sunucu). Yeni dış bağımlılık yok.
[package]
name = "taa-hata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TAA ortak hata raporlama: temizlenmiş rapor, tekrar birleştirme, yerel kuyruk, sunucuya gönderim"

[lib]
name = "taa_hata"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
taa-dosya = { path = "../taa-dosya" }
taa-kuyruk = { path = "../taa-kuyruk" }
