# TAA Kur kurulum ve kaldırma programı (tek exe). Tek bağımlılık: Windows'ta windows-sys (yerel kurulum penceresi). Çalışma alanının DIŞINDA: gömülecek dosyalar
# TAA_KUR_PAKET klasöründen gelir (tools/kur_paketle.sh hazırlar), o yüzden `cargo test --workspace` bunu derlemez.
[package]
name = "taa-kur-kurulum"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

# Yerel kurulum penceresi (Win32 + GDI, tarayıcısız). Yusuf'un onaylı bağımlılığı windows-sys 0.61 (taa-kur ve taa-ipc
# ile aynı sürüm); özellikler taa-kur penceresinin kümesi + tema (Registry), DPI (HiDpi), koyu başlık (Dwm), konsol gizleme,
# Yüksek Karşıtlık (Accessibility: HIGHCONTRASTW) ve vurgu rengi seçici (Controls_Dialogs: ChooseColorW).
# Tema çekirdeği (İlmek / Kalıp / Mezura, görünüm tercihi, logo): depodaki std-only crate, path ile; dış crate değil.
# [Claude#kurucu-arayuz 2026-11-17]
[dependencies]
taa-kur-tema = { path = "../crates/taa-kur-tema" }

# HD exe simgesi: build.rs, taa-kur-tema ile .rsrc nesnesi üretir (rc.exe/windres gerekmez). [Claude#kurucu-arayuz 2026-11-17]
[build-dependencies]
taa-kur-tema = { path = "../crates/taa-kur-tema" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]

[profile.release]
opt-level = "s"
strip = true
lto = true
